{% extends "base.html" %}
{% block content %}

<h2>Predict Spending Score</h2>

<form method="post">
    <label for="gender">Gender</label>
    <select name="gender" id="gender" required>
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label for="age">Age</label>
    <input type="number" name="age" id="age" step="1" min="1" required>

    <label for="annual_income">Annual Income</label>
    <input type="number" name="annual_income" id="annual_income" step="0.01" min="0" required>

    <button type="submit">Predict</button>
</form>

{% if prediction is not none %}
    <h3>Predicted Spending Score: {{ prediction }}</h3>
{% endif %}

{% endblock %}
